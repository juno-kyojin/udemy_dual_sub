<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 0;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
    }

    .header {
      background-color: #a435f0;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      background-color: white;
      border-bottom: 1px solid #ddd;
    }

    .tab-link {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 600;
      color: #6a6f73;
      border-bottom: 3px solid transparent;
      transition: 0.3s;
    }

    .tab-link.active {
      color: #a435f0;
      border-bottom: 3px solid #a435f0;
    }

    .tab-link:hover {
      background-color: #f0f0f0;
    }

    .tab-content {
      display: none;
      padding: 20px;
    }

    .tab-content.active {
      display: block;
    }

    .switch-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #a435f0;
    }

    input:checked+.slider:before {
      transform: translateX(20px);
    }

    .section-title {
      background-color: #ffeebb;
      padding: 8px;
      font-weight: bold;
      text-align: center;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
      color: #333;
    }

    .setting-row {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .setting-row label {
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    input[type="color"] {
      border: 1px solid #ccc;
      width: 40px;
      height: 25px;
      padding: 0;
      cursor: pointer;
    }

    input[type="range"] {
      width: 120px;
      cursor: pointer;
      accent-color: #a435f0;
    }

    .btn-group {
      display: flex;
      border: 1px solid #a435f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .btn-group button {
      background: white;
      color: #a435f0;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      border-right: 1px solid #a435f0;
    }

    .btn-group button:last-child {
      border-right: none;
    }

    .btn-group button.active {
      background: #a435f0;
      color: white;
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #ddd;
      background-color: #f8f9fa;
    }

    .footer a {
      color: #a435f0;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>Udemy Dual Subtitles</h2>
  </div>

  <div class="tabs">
    <button class="tab-link active" data-tab="basic">CÀI ĐẶT CƠ BẢN</button>
    <button class="tab-link" data-tab="advanced">CÀI ĐẶT NÂNG CAO</button>
  </div>

  <div id="basic" class="tab-content active">
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="toggleExtension">
        <span class="slider round"></span>
      </label>
      <span id="statusText">Bật phụ đề song ngữ</span>
    </div>

    <div class="setting-row" style="margin-top: 15px;">
      <label>Ngôn ngữ dịch:</label>
      <select id="targetLanguage" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
        <option value="vi">Tiếng Việt</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="zh-CN">中文</option>
      </select>
    </div>
    <p style="font-size: 12px; color: #666; margin-top: 10px;">
      Chọn ngôn ngữ để dịch phụ đề gốc sang ngôn ngữ bạn muốn.
    </p>
  </div>

  <div id="advanced" class="tab-content">
    <div class="section-title">Subtitle Style Settings <span class="info-icon">?</span></div>

    <div class="setting-row">
      <label>Font Color:</label>
      <input type="color" id="fontColor" value="#ffeb3b">
    </div>

    <div class="setting-row">
      <label>Font Weight:</label>
      <div class="btn-group" id="fontWeightGroup">
        <button data-value="300">LIGHT</button>
        <button data-value="700" class="active">NORMAL</button>
        <button data-value="900">BOLD</button>
      </div>
    </div>

    <div class="setting-row">
      <label>Font Size: <span id="fontSizeValue">20</span>px</label>
      <input type="range" id="fontSize" min="12" max="40" value="20">
    </div>

    <div class="setting-row">
      <label>Opacity: <span id="opacityValue">100</span>%</label>
      <input type="range" id="opacity" min="0" max="100" value="100">
    </div>

    <div class="setting-row">
      <label>Background Color:</label>
      <input type="color" id="bgColor" value="#000000">
    </div>
  </div>

  <div class="footer">
    Xây dựng với ❤️. Cảm ơn đã sử dụng. <a href="#" target="_blank">Phản hồi</a>
  </div>

  <script src="popup.js"></script>
</body>

</html>
